server {
  listen 80;
  listen [::]:80;
  server_name hub.engenize.com.br;
  if ($host != hub.engenize.com.br) { return 444; }

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name hub.engenize.com.br;
  if ($host != hub.engenize.com.br) { return 444; }
  ssl_certificate /etc/letsencrypt/live/hub.engenize.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hub.engenize.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://127.0.0.1:8083;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }
}
